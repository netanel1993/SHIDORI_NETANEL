    body {
      margin: 0;
      background: #ffe4ec;
      font-family: Arial, sans-serif;
      direction: rtl;
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 20%;
      background: #f6d1e0;
      padding: 20px;
      box-sizing: border-box;
    }
    .main-video {
      width: 60%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      flex-direction: column;
    }
    .main-video iframe {
      flex: 1;
    }
    .stats {
      background: #ffccdd;
      color: black;
      padding: 5px 10px;
      margin-top: 10px;
      border-radius: 10px;
      font-weight: bold;
    }
    .chat-box {
      width: 20%;
      background: #fff2f9;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .chat-message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .chat-message span {
      display: block;
      margin-top: 5px;
    }
    .hearts {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 24px;
      animation: floatUp 2s infinite ease-in-out;
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100px); opacity: 0; }
    }
    .avatars {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      background: #ffccdd;
      padding: 10px;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin: 0 5px;
      background: pink;
      border: 2px solid white;
    }
    .chat-input {
      display: flex;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }
    .chat-input button {
      padding: 10px 15px;
      margin-right: 5px;
      background: #ff99cc;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }
  </style>

      <button onclick="sendMessage()">שלח</button>
    </div>

    window.onload = function () {
      const chatBox = document.getElementById('chatMessages');
      const saved = localStorage.getItem('chatMessages');
      if (saved) {
        chatBox.innerHTML = saved;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      updateViewerCount();
      setInterval(updateViewerCount, 8000);
      setInterval(addFakeMessage, 7000);
    };

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;
      const chatBox = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-message';
      msgDiv.innerHTML = '<strong>אני:</strong><span>' + message + '</span>';
      chatBox.appendChild(msgDiv);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
      localStorage.setItem('chatMessages', chatBox.innerHTML);
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }
