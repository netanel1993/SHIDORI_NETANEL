<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שידורי נתנאל</title>
  <style>
    body {
      margin: 0;
      background: #ffe4ec;
      font-family: Arial, sans-serif;
      direction: rtl;
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 20%;
      background: #f6d1e0;
      padding: 20px;
      box-sizing: border-box;
    }
    .main-video {
      width: 60%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }
    .chat-box {
      width: 20%;
      background: #fff2f9;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .chat-message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .chat-message span {
      display: block;
      margin-top: 5px;
    }
    .hearts {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 24px;
      animation: floatUp 2s infinite ease-in-out;
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100px); opacity: 0; }
    }
    .avatars {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      background: #ffccdd;
      padding: 10px;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin: 0 5px;
      background: pink;
      border: 2px solid white;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>שידורי נתנאל</h2>
    <p>עקובים: 497K</p>
    <p>עקבו אחרינו באינסטגרם, טוויטר ויוטיוב!</p>
  </div>

  <div class="main-video">
    <iframe width="100%" height="100%" src="https://player.vimeo.com/video/76979871" frameborder="0" allowfullscreen></iframe>
    <div class="hearts">❤️ 😍 🍬</div>
  </div>

  <div class="chat-box">
    <div class="avatars">
      <div class="avatar"></div>
      <div class="avatar"></div>
      <div class="avatar"></div>
      <div class="avatar"></div>
      <div class="avatar"></div>
    </div>
    <div class="chat-message">
      <strong>גדי:</strong>
      <span>מאחלת אושר ושלוום!</span>
    </div>
    <div class="chat-message">
      <strong>שרון:</strong>
      <span>מותק אצבת את הסרטון?</span>
    </div>
    <div class="chat-message">
      <strong>דן:</strong>
      <span>רק בריאות!</span>
    </div>
  </div>

</body>
</html>
