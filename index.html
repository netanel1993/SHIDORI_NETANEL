<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>שידורי נתנאל</title>
  <style>
    body {
      margin: 0;
      background: #ffe4ec;
      font-family: Arial, sans-serif;
      direction: rtl;
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 20%;
      background: #f6d1e0;
      padding: 20px;
      box-sizing: border-box;
    }
    .main-video {
      width: 60%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      flex-direction: column;
    }
    .main-video iframe {
      flex: 1;
    }
    .stats {
      background: #ffccdd;
      color: black;
      padding: 5px 10px;
      margin-top: 10px;
      border-radius: 10px;
      font-weight: bold;
    }
    .chat-box {
      width: 20%;
      background: #fff2f9;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .chat-message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .chat-message span {
      display: block;
      margin-top: 5px;
    }
    .hearts {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 24px;
      animation: floatUp 2s infinite ease-in-out;
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100px); opacity: 0; }
    }
    .avatars {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      background: #ffccdd;
      padding: 10px;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin: 0 5px;
      background: pink;
      border: 2px solid white;
    }
    .chat-input {
      display: flex;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }
    .chat-input button {
      padding: 10px 15px;
      margin-right: 5px;
      background: #ff99cc;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }
    .sound-button {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: #ff4081;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="sound-button" onclick="enableSound()">הפעל סאונד 🔊</button>
  <audio id="pingSound" src="https://notificationsounds.com/storage/sounds/file-sounds-1146-pristine.mp3"></audio>

  <div class="sidebar">
    <h2>שידורי נתנאל</h2>
    <p>עקובים: 497K</p>
    <p>עקבו אחרינו באינסטגרם, טוויטר ויוטיוב!</p>
  </div>

  <div class="main-video">
    <iframe width="100%" height="100%" src="https://player.vimeo.com/video/76979871" frameborder="0" allowfullscreen></iframe>
    <div class="hearts">❤️ 😍 🍬</div>
    <div class="stats" id="statsDisplay">צופים עכשיו: 1</div>
  </div>

  <div class="chat-box">
    <div class="avatars">
      <div class="avatar"></div>
      <div class="avatar"></div>
      <div class="avatar"></div>
      <div class="avatar"></div>
      <div class="avatar"></div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="כתוב הודעה..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">שלח</button>
    </div>
  </div>

  <script>
    const fakeUsers = ["דנה", "מתן", "אור", "לינוי", "עידו", "רותם", "שקד", "טל", "יובל", "אביה", "שיר", "אופיר", "נועם", "לירון", "איתן", "רוני", "מאיה", "שחר", "אדם", "עמרי", "דניאל", "רון", "אביטל", "נטע", "מור", "ליאן", "מעיין", "תומר", "ברק", "אייל", "חיים", "שירז", "רונית", "עמית", "סיון", "דנה", "אסף", "אלינה", "נעמי", "יואב", "אבשלום", "דביר", "מאור", "אדיר", "הודיה", "אורטל", "עידן", "יוליה", "כרמל"];
    
    const fakeMessages = [
      "וואו איזה מדהים! 😍", "לא ראיתי דבר כזה בחיים שלי!", "מי עשה את העריכה המטורפת הזאת?!",
      "אין דברים כאלה פשוט🔥", "נתנאל אתה אגדה!", "אמא'לה איזה מתח!", "כל שידור יותר טוב מהקודם!",
      "כבר התמכרתי לזה 😅", "זה חייב להגיע לוויראלי!!", "פשוט מרגש ברמות!!", "תנו לייק!", "צוחק בקול!",
      "בא לי עוד פרק עכשיו!", "תוציא מרצ'!!", "רמה עולמית!", "הלב שלי דופק!", "זה שידור חי?! מטורף!", 
      "הכי טוב ברשת", "תותח על!", "אין מתחרים!", "תמשיכו ככה!", "אמנות טהורה", "תענוג של תוכן", "נתנאל כובש!"
    ];

    const chatBox = document.getElementById('chatMessages');
    const pingSound = document.getElementById("pingSound");
    let userInteracted = false;

    function enableSound() {
      userInteracted = true;
      pingSound.play().catch(() => {});
    }

    function playPing() {
      if (userInteracted) {
        pingSound.currentTime = 0;
        pingSound.play().catch(() => {});
      }
    }

    window.onload = function () {
      const saved = localStorage.getItem('chatMessages');
      if (saved) {
        chatBox.innerHTML = saved;
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      updateViewerCount();
      setInterval(updateViewerCount, 8000);
      setInterval(addFakeMessage, 7000);
    };

    function updateViewerCount() {
      const viewers = Math.floor(Math.random() * 40) + 10;
      document.getElementById("statsDisplay").innerText = "צופים עכשיו: " + viewers;
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-message';
      msgDiv.innerHTML = '<strong>אני:</strong><span>' + message + '</span>';
      chatBox.appendChild(msgDiv);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
      localStorage.setItem('chatMessages', chatBox.innerHTML);
      playPing();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function addFakeMessage() {
      const user = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
      const text = fakeMessages[Math.floor(Math.random() * fakeMessages.length)];
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-message';
      msgDiv.innerHTML = '<strong>' + user + ':</strong><span>' + text + '</span>';
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      playPing();
    }
  </script>

</body>
</html>
